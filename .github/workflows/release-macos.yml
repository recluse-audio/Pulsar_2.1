name: Release macOS (sign + notarize)

# Phase 3: keychain provisioning + notary profile registration. Sets up the
# `notary-profile` that SIGNED/MAC/notarize_mac.py expects to exist.
# Still does NOT actually sign or notarize — Phase 4 wires that in.
# See .claude/github-mac-signing-plan.md for the full phased plan.

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-14  # Apple Silicon; supports universal builds via Xcode

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        run: brew install cmake

      - name: Setup signing keychain
        env:
          KEYCHAIN_PW: ${{ secrets.MAC_KEYCHAIN_PASSWORD }}
          APP_P12_B64: ${{ secrets.MAC_DEVID_APP_P12_BASE64 }}
          APP_P12_PW:  ${{ secrets.MAC_DEVID_APP_P12_PASSWORD }}
          INS_P12_B64: ${{ secrets.MAC_DEVID_INSTALLER_P12_BASE64 }}
          INS_P12_PW:  ${{ secrets.MAC_DEVID_INSTALLER_P12_PASSWORD }}
        run: |
          set -euo pipefail

          # Fail fast with a clear message if any secret is missing.
          : "${KEYCHAIN_PW:?MAC_KEYCHAIN_PASSWORD secret is not set}"
          : "${APP_P12_B64:?MAC_DEVID_APP_P12_BASE64 secret is not set}"
          : "${APP_P12_PW:?MAC_DEVID_APP_P12_PASSWORD secret is not set}"
          : "${INS_P12_B64:?MAC_DEVID_INSTALLER_P12_BASE64 secret is not set}"
          : "${INS_P12_PW:?MAC_DEVID_INSTALLER_P12_PASSWORD secret is not set}"

          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"

          # Create a fresh, throwaway keychain so secrets never touch login.keychain.
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain   # no auto-lock during job
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain

          # Make our keychain searchable so `find-identity` and codesign discover it.
          # Keep login.keychain in the search list so brew/etc. still work.
          security list-keychains -d user -s build.keychain login.keychain

          # Decode each p12 to a temp file (mktemp -> auto-cleaned by the runner VM).
          APP_P12="$(mktemp -t devid_app).p12"
          INS_P12="$(mktemp -t devid_installer).p12"
          echo "$APP_P12_B64" | base64 --decode > "$APP_P12"
          echo "$INS_P12_B64" | base64 --decode > "$INS_P12"

          # Import. -T allowlists which tools can use the private key without prompting.
          security import "$APP_P12" -k build.keychain -P "$APP_P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security
          security import "$INS_P12" -k build.keychain -P "$INS_P12_PW" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security

          # Suppress the GUI "allow access" prompt that would otherwise hang the runner.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s -k "$KEYCHAIN_PW" build.keychain >/dev/null

          # Wipe the decoded p12s as soon as they're imported.
          rm -f "$APP_P12" "$INS_P12"

      - name: Verify signing identities
        run: |
          set -e
          echo "Identities visible to codesigning tools:"
          security find-identity -v
          echo
          echo "Confirming both Developer ID identities are present..."
          security find-identity -v | grep -q "Developer ID Application:"
          security find-identity -v | grep -q "Developer ID Installer:"
          echo "OK: both identities found."

      - name: Register notary profile
        env:
          APPLE_ID:           ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:      ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARYTOOL_PASSWORD: ${{ secrets.APPLE_NOTARYTOOL_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?APPLE_ID secret is not set}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID secret is not set}"
          : "${APPLE_NOTARYTOOL_PASSWORD:?APPLE_NOTARYTOOL_PASSWORD secret is not set}"

          # Profile name 'notary-profile' matches DEFAULT_NOTARY_PROFILE in
          # SIGNED/MAC/mac_identity.py — keep them in sync if either changes.
          xcrun notarytool store-credentials notary-profile \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_NOTARYTOOL_PASSWORD" \
            --keychain "$HOME/Library/Keychains/build.keychain-db"

          echo "OK: notary profile 'notary-profile' registered."

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION.txt)" >> "$GITHUB_OUTPUT"

      - name: Configure (universal)
        run: |
          cmake -S . -B BUILD \
            -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build All (Release, universal)
        run: cmake --build BUILD --target Pulsar_All --config Release

      - name: Verify universal slices
        run: |
          set -e
          ART="BUILD/Pulsar_artefacts/Release"
          lipo -info "$ART/VST3/Pulsar.vst3/Contents/MacOS/Pulsar"
          lipo -info "$ART/AU/Pulsar.component/Contents/MacOS/Pulsar"
          lipo -info "$ART/Standalone/Pulsar.app/Contents/MacOS/Pulsar"

      - name: Package unsigned bundles
        run: |
          ART="BUILD/Pulsar_artefacts/Release"
          ditto -c -k --sequesterRsrc --keepParent "$ART/VST3/Pulsar.vst3"        Pulsar-macOS-VST3-unsigned.zip
          ditto -c -k --sequesterRsrc --keepParent "$ART/AU/Pulsar.component"     Pulsar-macOS-AU-unsigned.zip
          ditto -c -k --sequesterRsrc --keepParent "$ART/Standalone/Pulsar.app"   Pulsar-macOS-Standalone-unsigned.zip

      - name: Upload unsigned bundles
        uses: actions/upload-artifact@v4
        with:
          name: Pulsar-macOS-${{ steps.version.outputs.version }}-unsigned
          path: |
            Pulsar-macOS-VST3-unsigned.zip
            Pulsar-macOS-AU-unsigned.zip
            Pulsar-macOS-Standalone-unsigned.zip

      - name: Tear down signing keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
