name: Release Windows (sign + package)

# Phase 3: signing toolchain provisioned + Azure auth wired in. Writes
# metadata.json from secrets, exports AZURE_* for DefaultAzureCredential,
# then smoke-signs the just-built Pulsar.exe and verifies with signtool /pa.
# Full release_workflow_pc.py wiring lands in Phase 4.
# See .claude/github-pc-signing-plan.md for the full phased plan.

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidate = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $candidate) {
              $iscc = $candidate
              "$([System.IO.Path]::GetDirectoryName($candidate))" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            }
          }
          if (-not $iscc) { throw "iscc.exe not found after install." }
          Write-Host "OK: iscc at $iscc"

      - name: Install Azure Trusted Signing Client Tools
        shell: pwsh
        run: |
          # NuGet pull is more reliable than winget on hosted runners.
          # Land the dlib at the same LOCALAPPDATA path the local dev setup uses,
          # so SIGNED/PC/sign_pc_*.py finds it without any env override.
          $dest = Join-Path $env:LOCALAPPDATA "Microsoft\MicrosoftArtifactSigningClientTools"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $work = Join-Path $env:RUNNER_TEMP "tsc"
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          nuget install Microsoft.ArtifactSigning.Client -OutputDirectory $work -ExcludeVersion -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "nuget install failed (exit $LASTEXITCODE)." }

          $dll = Get-ChildItem -Path $work -Recurse -Filter "Azure.CodeSigning.Dlib.dll" -ErrorAction SilentlyContinue |
                 Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $dll) { throw "Azure.CodeSigning.Dlib.dll not found in NuGet package." }

          # Copy entire bin folder (dll has native + managed deps next to it).
          $binDir = $dll.Directory.FullName
          Copy-Item -Path (Join-Path $binDir "*") -Destination $dest -Recurse -Force
          Write-Host "Copied dlib payload from $binDir to $dest"

      - name: Configure Azure Code Signing (write metadata.json)
        shell: pwsh
        env:
          ACS_ENDPOINT: ${{ secrets.ACS_ENDPOINT }}
          ACS_ACCOUNT_NAME: ${{ secrets.ACS_ACCOUNT_NAME }}
          ACS_PROFILE_NAME: ${{ secrets.ACS_PROFILE_NAME }}
        run: |
          if (-not $env:ACS_ENDPOINT)     { throw "ACS_ENDPOINT secret missing." }
          if (-not $env:ACS_ACCOUNT_NAME) { throw "ACS_ACCOUNT_NAME secret missing." }
          if (-not $env:ACS_PROFILE_NAME) { throw "ACS_PROFILE_NAME secret missing." }
          if (-not $env:AZURE_TENANT_ID)     { throw "AZURE_TENANT_ID secret missing." }
          if (-not $env:AZURE_CLIENT_ID)     { throw "AZURE_CLIENT_ID secret missing." }
          if (-not $env:AZURE_CLIENT_SECRET) { throw "AZURE_CLIENT_SECRET secret missing." }

          $azureDir = Join-Path $HOME ".azure"
          New-Item -ItemType Directory -Force -Path $azureDir | Out-Null
          $metadata = [ordered]@{
            Endpoint               = $env:ACS_ENDPOINT
            CodeSigningAccountName = $env:ACS_ACCOUNT_NAME
            CertificateProfileName = $env:ACS_PROFILE_NAME
          } | ConvertTo-Json
          Set-Content -Path (Join-Path $azureDir "metadata.json") -Value $metadata -Encoding utf8
          Write-Host "OK: metadata.json written to $azureDir"

      - name: Verify signing toolchain
        shell: pwsh
        run: |
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $candidates = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                          Where-Object { $_.FullName -like "*\x64\signtool.exe" } |
                          Sort-Object FullName -Descending
            if ($candidates) {
              $signtool = $candidates[0].FullName
              "$([System.IO.Path]::GetDirectoryName($signtool))" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
            }
          }
          if (-not $signtool) { throw "signtool.exe not found." }
          Write-Host "OK: signtool at $signtool"

          $dlib = Join-Path $env:LOCALAPPDATA "Microsoft\MicrosoftArtifactSigningClientTools\Azure.CodeSigning.Dlib.dll"
          if (-not (Test-Path $dlib)) { throw "Azure.CodeSigning.Dlib.dll not found at $dlib" }
          Write-Host "OK: dlib at $dlib"

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION.txt).Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "VERSION.txt = $version"

      - name: Configure
        run: cmake -S . -B BUILD -DCMAKE_BUILD_TYPE=Release

      - name: Build All (Release)
        run: cmake --build BUILD --target Pulsar_All --config Release

      - name: Verify build outputs
        shell: pwsh
        run: |
          $art = "BUILD/Pulsar_artefacts/Release"
          $vst3 = "$art/VST3/Pulsar.vst3/Contents/x86_64-win/Pulsar.vst3"
          $exe  = "$art/Standalone/Pulsar.exe"
          if (-not (Test-Path $vst3)) { throw "VST3 not found: $vst3" }
          if (-not (Test-Path $exe))  { throw "Standalone not found: $exe" }
          Write-Host "OK: VST3 + Standalone present."

      - name: Diagnose Azure auth
        shell: pwsh
        run: |
          # Confirm SP creds work and role is reachable.
          az login --service-principal `
            -u $env:AZURE_CLIENT_ID `
            -p $env:AZURE_CLIENT_SECRET `
            -t $env:AZURE_TENANT_ID
          if ($LASTEXITCODE -ne 0) { throw "az login failed — bad SP creds." }

          Write-Host "Account context:"
          az account show
          Write-Host ""
          Write-Host "Role assignments for this SP:"
          az role assignment list --assignee $env:AZURE_CLIENT_ID --all -o table

      - name: Smoke-test sign (Pulsar.exe)
        shell: pwsh
        run: |
          $exe = "BUILD/Pulsar_artefacts/Release/Standalone/Pulsar.exe"
          $smokeCopy = Join-Path $env:RUNNER_TEMP "Pulsar.smoke.exe"
          Copy-Item $exe $smokeCopy -Force

          $dlib = Join-Path $env:LOCALAPPDATA "Microsoft\MicrosoftArtifactSigningClientTools\Azure.CodeSigning.Dlib.dll"
          $metadata = Join-Path $HOME ".azure\metadata.json"

          signtool.exe sign /v /debug `
            /fd SHA256 `
            /tr "http://timestamp.acs.microsoft.com" /td SHA256 `
            /dlib $dlib /dmdf $metadata `
            $smokeCopy
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed (exit $LASTEXITCODE)." }

          signtool.exe verify /pa /v $smokeCopy
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed (exit $LASTEXITCODE)." }

          Write-Host "OK: smoke-test sign + verify passed."

      - name: Upload unsigned VST3
        uses: actions/upload-artifact@v4
        with:
          name: Pulsar-Windows-VST3-${{ steps.version.outputs.version }}-unsigned
          path: BUILD/Pulsar_artefacts/Release/VST3/Pulsar.vst3

      - name: Upload unsigned Standalone
        uses: actions/upload-artifact@v4
        with:
          name: Pulsar-Windows-Standalone-${{ steps.version.outputs.version }}-unsigned
          path: BUILD/Pulsar_artefacts/Release/Standalone/Pulsar.exe
